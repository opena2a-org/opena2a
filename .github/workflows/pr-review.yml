name: PR Review

# The review logic and the verdict function live in .github/scripts/pr-review.mjs
# (a gate file like this one). The model reports findings; the script decides
# the verdict, so the same head cannot flip between rounds on sampling alone.
#
# pull_request_review is the recorded human path: an approver's APPROVED
# review on the exact head, disposing of every blocking item of that head's
# round by number, substitutes APPROVE and the run posts the substitution. It
# never calls the model: re-reviewing on a review event would be a re-run to
# green on an unchanged head.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]

# One group per event: a review event must never cancel a model round in
# progress, or anyone's comment-only review could stop the gate mid-run.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  # No job-level `if`: a skipped job reports success to a required check, so
  # every event that starts this job must end in the Enforce verdict step.
  review:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
      OUT_DIR: /tmp/pr-review
      # The same approver set as gate-file-approval.yml; a test pins them equal.
      APPROVERS: thebenignhacker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get PR diff
        id: diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CAP=122880

          # Capture the full diff, then decide separately whether it fits, so
          # an over-cap diff is never reviewed as if its first 120KB were the
          # whole change.
          gh pr diff "$PR_NUMBER" > /tmp/pr-diff-full.txt
          FULL=$(wc -c < /tmp/pr-diff-full.txt)
          head -c "$CAP" /tmp/pr-diff-full.txt > /tmp/pr-diff.txt

          if [ "$FULL" -gt "$CAP" ]; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
          else
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi
          echo "full_bytes=$FULL" >> "$GITHUB_OUTPUT"

      - name: Model round
        id: model
        if: github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIFF_FILE: /tmp/pr-diff.txt
          TRUNCATED: ${{ steps.diff.outputs.truncated }}
          FULL_BYTES: ${{ steps.diff.outputs.full_bytes }}
        run: node .github/scripts/pr-review.mjs model-round

      - name: Human round
        id: human
        if: github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login }}
        run: node .github/scripts/pr-review.mjs human-round

      - name: Post review
        # Posting is best effort and must never decide the outcome. A run that
        # cannot comment (a read-only token, a rate limit) is a delivery
        # problem, not a review result. The conclusion is set by the next step.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s "$OUT_DIR/comment.md" ] || { echo "Nothing to post."; exit 0; }
          cat "$OUT_DIR/comment.md" >> "$GITHUB_STEP_SUMMARY"

          # Comment only. This job does not submit pull request reviews: an
          # approving review from GITHUB_TOKEN counts toward a required-approval
          # rule, which would let the bot satisfy a human requirement.
          if ! gh pr comment "$PR_NUMBER" --body-file "$OUT_DIR/comment.md"; then
            echo "::warning::Could not post the review comment; it is in the job summary instead."
          fi

      - name: Enforce verdict
        # The job conclusion IS the policy decision, and it is decided here so
        # that nothing upstream can turn a REQUEST_CHANGES into a green check by
        # succeeding at something unrelated.
        env:
          VERDICT: ${{ steps.model.outputs.verdict || steps.human.outputs.verdict }}
        run: |
          case "$VERDICT" in
            APPROVE)
              echo "Automated review approved."
              ;;
            REQUEST_CHANGES)
              echo "::error::Automated review requested changes."
              exit 1
              ;;
            *)
              echo "::error::Automated review was inconclusive ($VERDICT). Treated as not passing."
              exit 1
              ;;
          esac
