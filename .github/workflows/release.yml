name: Release

on:
  push:
    tags:
      - 'v*'
      - 'cli-v*'
      - 'shared-v*'
      - 'cli-ui-v*'
      - 'contribute-v*'
      - 'aim-core-v*'
      - 'ai-classifier-v*'
      - 'registry-client-v*'
      - 'check-core-v*'
      - 'telemetry-v*'
      - 'credential-patterns-v*'
      - 'atx-verify-v*'

permissions:
  contents: write
  id-token: write
  # Read-only; needed by the "CI must be green on the tagged commit" step below
  # to query the Actions API. A `permissions:` block grants ONLY what is
  # listed, so omitting this makes that query 403 -- which fails closed and
  # looks exactly like red CI, for the wrong reason.
  actions: read

# Opt the v4-line JavaScript actions (checkout, setup-node, action-gh-release)
# into Node 24 today. They run on Node 20 by default and emit a deprecation
# warning on every release; the runner forces Node 24 on 2026-06-02. Setting
# this env now silences the warning AND avoids surprise breakage in June.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestry guard below needs real history; the default shallow
          # clone cannot answer whether the tagged commit is on main.
          fetch-depth: 0

      - name: Tagged commit must be on main
        run: |
          # The tag push IS the publish event, and it publishes whatever commit
          # the tag points at -- including one on a branch that was never
          # merged, or force-pushed somewhere unreviewed. Every gate on `main`
          # is bypassed by tagging around it, so this is the check that makes
          # those gates mean something at publish time.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not an ancestor of origin/main."
            echo "Publishing from a commit that is not on main bypasses every check that gates main."
            echo "Merge it first, then tag the merged commit."
            exit 1
          fi
          echo "$GITHUB_SHA is on main."

      - name: CI must be green on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The tag push IS the publish event, so "main is green" has to be
          # true of THIS commit at THIS moment, not of some earlier run in a
          # tab. ci.yml runs on every push to main (since #283), so the tagged
          # commit -- always an ancestor of main per the guard above -- has a
          # run to find, though not always a FINISHED one: a tag is routinely
          # pushed 44-81s after its merge commit, and ci.yml's wall clock is
          # ~110-125s. Reading only completed runs would fail closed on a
          # release that is perfectly fine and merely early -- measured, that
          # was 5 of the last 6 releases. So queued/in_progress means WAIT;
          # only a finished non-success is red.
          deadline=$(( SECONDS + 900 ))   # 15 min; ci.yml wall clock is ~110-125s
          while :; do
            runs=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | {status, conclusion}]')

            total=$(echo "$runs" | jq 'length')
            if [ "$total" -eq 0 ]; then
              # No run YET is not the same as no run EVER. Keep waiting until
              # the deadline, then fail -- a tagged commit with no CI run at
              # all is exactly the state this gate exists to refuse.
              if [ $SECONDS -ge $deadline ]; then
                echo "::error::No ci.yml run found for ${GITHUB_SHA} after 15 minutes."
                echo "main's tip must have a CI run before it can be published."
                exit 1
              fi
              echo "No ci.yml run for ${GITHUB_SHA} yet; waiting... (${SECONDS}s)"
              sleep 15
              continue
            fi

            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(echo "$runs"  | jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length')

            # A finished failure is decisive immediately -- do not burn 15
            # minutes waiting for a sibling when one leg has already lost.
            if [ "$failed" -gt 0 ]; then
              echo "::error::CI is not green on ${GITHUB_SHA} (${failed} non-success run(s))."
              echo "Publishing from a red tip would ship a commit no gate vouched for."
              gh run list --commit "${GITHUB_SHA}" --limit 20 || true
              exit 1
            fi

            if [ "$pending" -eq 0 ]; then
              echo "CI is green on ${GITHUB_SHA} (${total} completed run(s), all success)."
              break
            fi

            if [ $SECONDS -ge $deadline ]; then
              echo "::error::CI still in progress on ${GITHUB_SHA} after 15 minutes (${pending} pending)."
              echo "Failing closed: the publish must not race the gate."
              exit 1
            fi
            echo "CI in progress on ${GITHUB_SHA} (${pending} pending); waiting... (${SECONDS}s)"
            sleep 15
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      - name: Generate release manifest
        run: |
          cd packages/cli
          echo '{"version":"${{ github.ref_name }}","generatedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","algorithm":"sha256","artifacts":{}}' > dist/manifest.json
          find dist -type f -name '*.js' -o -name '*.d.ts' | sort | while read f; do
            hash=$(shasum -a 256 "$f" | cut -d' ' -f1)
            node -e "const m=require('./dist/manifest.json');m.artifacts['$(basename $f)']='$hash';require('fs').writeFileSync('./dist/manifest.json',JSON.stringify(m,null,2))"
          done
          cat dist/manifest.json

      - run: npm run test

      - name: Publish packages (idempotent — skips if version already on npm)
        id: publish
        run: |
          set -e
          : > /tmp/published.txt
          : > /tmp/skipped.txt
          publish_if_new() {
            local ws="$1"
            local pkg="$2"
            local ver
            ver=$(node -p "require('./$ws/package.json').version")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "::notice::$pkg@$ver already on npm — skipping publish"
              echo "$pkg" >> /tmp/skipped.txt
            else
              echo "Publishing $pkg@$ver with provenance..."
              npm publish --workspace="$ws" --provenance --access public
              echo "$pkg" >> /tmp/published.txt
            fi
          }
          publish_if_new packages/cli opena2a-cli
          publish_if_new packages/shared @opena2a/shared
          publish_if_new packages/cli-ui @opena2a/cli-ui
          publish_if_new packages/contribute @opena2a/contribute
          publish_if_new packages/ai-classifier @opena2a/ai-classifier
          publish_if_new packages/aim-core @opena2a/aim-core
          publish_if_new packages/registry-client @opena2a/registry-client
          publish_if_new packages/check-core @opena2a/check-core
          publish_if_new packages/telemetry @opena2a/telemetry
          publish_if_new packages/credential-patterns @opena2a/credential-patterns
          publish_if_new packages/atx-verify @opena2a/atx-verify
          echo "=== Published this run ==="
          cat /tmp/published.txt
          echo "=== Skipped (version already on npm) ==="
          cat /tmp/skipped.txt

      - name: Verify provenance on newly-published packages
        run: |
          verify_attestations() {
            local pkg="$1"
            local deadline=$((SECONDS + 300))
            local attestations=""
            while [ $SECONDS -lt $deadline ]; do
              attestations=$(npm view "$pkg" dist.attestations --json 2>&1 || true)
              if [ -n "$attestations" ] && [ "$attestations" != "null" ] && [ "$attestations" != "{}" ]; then
                echo "Provenance verified for $pkg"
                return 0
              fi
              echo "Attestations for $pkg not yet visible, retrying in 15s... (elapsed ${SECONDS}s)"
              sleep 15
            done
            echo "::error::Provenance attestations missing from npm for $pkg after 5 minutes"
            return 1
          }
          if [ ! -s /tmp/published.txt ]; then
            echo "No packages published this run — nothing to verify."
            exit 0
          fi
          while IFS= read -r pkg; do
            verify_attestations "$pkg" || exit 1
          done < /tmp/published.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
